# Nginx HTTPS 配置文件
# 保存为：/etc/nginx/conf.d/boke.conf

upstream boke_app {
    server 127.0.0.1:8000;
}

# HTTP 重定向到 HTTPS
server {
    listen 80;
    server_name www.teselx.cn teselx.cn;
    
    # 重定向到 HTTPS
    return 301 https://$server_name$request_uri;
}

# HTTPS 配置
server {
    listen 443 ssl http2;
    server_name www.teselx.cn teselx.cn;
    
    # SSL 证书配置
    ssl_certificate /boke/ssl/www.teselx.cn.pem;
    ssl_certificate_key /boke/ssl/www.teselx.cn.key;
    
    # SSL 优化配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # HSTS (可选)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    
    # 允许大文件上传
    client_max_body_size 1024M;  # 1GB
    client_body_timeout 1800s;   # 30分钟（匹配 Gunicorn）
    client_body_buffer_size 1M;
    
    # 静态文件（CSS, JS, 图片等）
    location /static/ {
        alias /boke/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    
    # 媒体文件（用户上传的视频、文件等）
    location /media/ {
        alias /boke/media/;
        expires 7d;
        add_header Cache-Control "public";
        add_header Accept-Ranges bytes;
        autoindex off;
    }
    
    # 视频流内部路由 - 由 Django X-Accel-Redirect 触发，Nginx 直接发送文件
    location /protected-media/ {
        internal;
        alias /boke/media/;
        add_header Accept-Ranges bytes;
        add_header Cache-Control "public, max-age=3600";
    }
    
    # Django 应用（动态请求转发到 Gunicorn）
    location / {
        proxy_pass http://boke_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 超时设置（处理大文件上传）
        proxy_connect_timeout 1800s;  # 30分钟（匹配 Gunicorn）
        proxy_send_timeout 1800s;      # 30分钟
        proxy_read_timeout 1800s;      # 30分钟
        
        # 缓冲设置
        proxy_buffering off;
        proxy_request_buffering off;
        
        # WebSocket 支持
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
    
    # 视频文件特殊处理
    location ~* \.(mp4|webm|avi|mov)$ {
        proxy_pass http://boke_app;
        proxy_set_header Host $host;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;
        proxy_request_buffering off;
        expires 30d;
        add_header Cache-Control "public";
    }
    
    # 健康检查端点
    location /health/ {
        proxy_pass http://boke_app;
        access_log off;
    }
}


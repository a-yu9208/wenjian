{% extends 'base.html' %}
{% load static %}

{% block title %}修改密码 - {{ site_settings.site_name }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-4">
        <div class="card">
            <div class="card-header">
                <h4 class="text-center"><i class="bi bi-shield-lock"></i> 修改密码</h4>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="old_password" class="form-label">原密码</label>
                        <input type="password" class="form-control" id="old_password" name="old_password" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label for="new_password" class="form-label">新密码</label>
                        <input type="password" class="form-control" id="new_password" name="new_password" required minlength="6">
                        <div class="form-text">密码至少6位</div>
                    </div>
                    <div class="mb-3">
                        <label for="new_password2" class="form-label">确认新密码</label>
                        <input type="password" class="form-control" id="new_password2" name="new_password2" required minlength="6">
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-lg"></i> 确认修改
                        </button>
                    </div>
                </form>
                <hr>
                <p class="text-center mb-0">
                    <a href="{% url 'accounts:profile' %}"><i class="bi bi-arrow-left"></i> 返回个人中心</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}

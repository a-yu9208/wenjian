{% extends 'base.html' %}
{% load static %}

{% block title %}上传视频 - {{ site_settings.site_name }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">
                <h4><i class="bi bi-cloud-upload"></i> 上传视频</h4>
            </div>
            <div class="card-body">
                <form id="uploadForm" enctype="multipart/form-data">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="video" class="form-label">选择视频文件 *</label>
                        <input type="file" class="form-control" id="video" name="video" accept="video/*" required>
                        <small class="text-muted">支持 mp4, avi, mov 等格式</small>
                    </div>
                    
                    <div class="mb-3">
                        <label for="thumbnail" class="form-label">封面图片（可选）</label>
                        <input type="file" class="form-control" id="thumbnail" name="thumbnail" accept="image/*">
                        <small class="text-muted">如果不上传，将自动截取视频第一帧作为封面</small>
                    </div>
                    
                    <div class="mb-3">
                        <label for="title" class="form-label">标题 *</label>
                        <input type="text" class="form-control" id="title" name="title" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="description" class="form-label">简介</label>
                        <textarea class="form-control" id="description" name="description" rows="4"></textarea>
                    </div>
                    
                    <div class="mb-3">
                        <label for="visibility" class="form-label">可见性 *</label>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="visibility" id="visibility_public" value="public" checked>
                            <label class="form-check-label" for="visibility_public">
                                <i class="bi bi-globe"></i> 公开 - 所有人可以查看（需管理员审核）
                            </label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="visibility" id="visibility_private" value="private">
                            <label class="form-check-label" for="visibility_private">
                                <i class="bi bi-lock"></i> 私密 - 只有您能看到（无需审核）
                            </label>
                        </div>
                        <small class="text-muted">选择私密不会在网站显示，只有您个人中心可见</small>
                    </div>
                    
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-upload"></i> 上传视频
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<div id="uploadProgress" class="mt-3" style="display: none;">
    <div class="progress">
        <div class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar" style="width: 0%"></div>
    </div>
    <p class="text-center mt-2" id="uploadStatus"></p>
</div>
{% endblock %}

{% block extra_js %}
<script>
$(document).ready(function() {
    $('#uploadForm').submit(function(e) {
        e.preventDefault();
        
        var formData = new FormData(this);
        $('#uploadProgress').show();
        
        $.ajax({
            url: '{% url "videos:upload" %}',
            method: 'POST',
            data: formData,
            processData: false,
            contentType: false,
            xhr: function() {
                var xhr = new window.XMLHttpRequest();
                xhr.upload.addEventListener("progress", function(evt) {
                    if (evt.lengthComputable) {
                        var percentComplete = evt.loaded / evt.total * 100;
                        $('.progress-bar').css('width', percentComplete + '%');
                        $('#uploadStatus').text('上传中... ' + Math.round(percentComplete) + '%');
                    }
                }, false);
                return xhr;
            },
            success: function(data) {
                alert(data.message || '上传成功');
                window.location.href = '/';
            },
            error: function(xhr) {
                var errorMsg = '上传失败';
                if (xhr.responseJSON && xhr.responseJSON.error) {
                    errorMsg += '：' + xhr.responseJSON.error;
                } else if (xhr.status === 502) {
                    errorMsg += '：服务器无响应，可能是文件太大或超时，请稍后重试';
                } else if (xhr.status === 413) {
                    errorMsg += '：文件太大，请上传小于1GB的文件';
                } else if (xhr.status === 504) {
                    errorMsg += '：上传超时，请检查网络连接或稍后重试';
                } else {
                    errorMsg += '：' + (xhr.statusText || '未知错误');
                }
                alert(errorMsg);
                $('#uploadProgress').hide();
            },
            timeout: 1800000,  // 30分钟超时
            complete: function() {
                // 不在complete中隐藏，让用户看到最终状态
            }
        });
    });
});
</script>
{% endblock %}

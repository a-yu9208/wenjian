{% extends "admin/change_form.html" %}
{% load static %}

{% block extrahead %}
{{ block.super }}
<style>
.approve-btn, .reject-btn {
    display: inline-block;
    padding: 10px 20px;
    margin: 5px;
    border: none;
    border-radius: 4px;
    color: white;
    cursor: pointer;
    font-size: 14px;
}
.approve-btn {
    background-color: #28a745;
}
.approve-btn:hover {
    background-color: #218838;
}
.reject-btn {
    background-color: #dc3545;
}
.reject-btn:hover {
    background-color: #c82333;
}
</style>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script>
function approveVideo(id) {
    if (!confirm('确定要通过此视频审核吗？')) return;
    
    $.ajax({
        url: 'ajax-approve/',
        method: 'POST',
        data: {
            'video_id': id,
            'csrfmiddlewaretoken': $('[name=csrfmiddlewaretoken]').val()
        },
        success: function(data) {
            alert('✓ 视频已通过审核');
            window.location.reload();
        },
        error: function(xhr) {
            alert('✗ 操作失败：' + (xhr.responseJSON?.error || '未知错误'));
        }
    });
}

function rejectVideo(id) {
    if (!confirm('确定要驳回此视频吗？')) return;
    
    $.ajax({
        url: 'ajax-reject/',
        method: 'POST',
        data: {
            'video_id': id,
            'csrfmiddlewaretoken': $('[name=csrfmiddlewaretoken]').val()
        },
        success: function(data) {
            alert('✗ 视频已驳回');
            window.location.reload();
        },
        error: function(xhr) {
            alert('✗ 操作失败：' + (xhr.responseJSON?.error || '未知错误'));
        }
    });
}

function makePublic(id) {
    if (!confirm('确定要将此私密视频转为公开吗？需要管理员审核。')) return;
    
    $.ajax({
        url: 'ajax-make-public/',
        method: 'POST',
        data: {
            'video_id': id,
            'csrfmiddlewaretoken': $('[name=csrfmiddlewaretoken]').val()
        },
        success: function(data) {
            alert('✓ 视频已转为公开，等待审核');
            window.location.reload();
        },
        error: function(xhr) {
            alert('✗ 操作失败：' + (xhr.responseJSON?.error || '未知错误'));
        }
    });
}
</script>
{% endblock %}

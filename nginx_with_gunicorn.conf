# Nginx 配置文件 - 与 Gunicorn 配合使用
# 保存为：/etc/nginx/conf.d/boke.conf

upstream boke_app {
    # Gunicorn 服务器地址
    server 127.0.0.1:8000;
}

server {
    listen 80;
    server_name 39.102.212.8;  # 您的服务器IP
    
    # 允许大文件上传（视频文件）
    client_max_body_size 1024M;  # 1GB
    client_body_timeout 900s;    # 15分钟（大文件上传需要更长时间）
    client_body_buffer_size 1M;  # 上传缓冲区
    
    # 静态文件（CSS, JS, 图片等）
    location /static/ {
        alias /boke/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        # 添加缓存头
        access_log off;
    }
    
    # 媒体文件（用户上传的视频、文件等）
    location /media/ {
        alias /boke/media/;
        expires 7d;
        add_header Cache-Control "public";
        # 支持视频断点续传
        add_header Accept-Ranges bytes;
        # 防止下载目录结构
        autoindex off;
    }
    
    # 视频流内部路由 - 由 Django X-Accel-Redirect 触发，Nginx 直接发送文件
    location /protected-media/ {
        internal;
        alias /boke/media/;
        add_header Accept-Ranges bytes;
        add_header Cache-Control "public, max-age=3600";
    }
    
    # Django 应用（动态请求转发到 Gunicorn）
    location / {
        proxy_pass http://boke_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 超时设置（处理大文件上传）
        proxy_connect_timeout 900s;
        proxy_send_timeout 900s;
        proxy_read_timeout 900s;
        
        # 缓冲设置
        proxy_buffering off;
        proxy_request_buffering off;
        
        # WebSocket 支持（如果需要）
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
    
    # 视频文件特殊处理（支持断点续传）
    location ~* \.(mp4|webm|avi|mov)$ {
        proxy_pass http://boke_app;
        proxy_set_header Host $host;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        
        # 禁用缓冲（视频流）
        proxy_buffering off;
        proxy_request_buffering off;
        
        # 缓存设置
        expires 30d;
        add_header Cache-Control "public";
    }
    
    # 健康检查端点（可选）
    location /health/ {
        proxy_pass http://boke_app;
        access_log off;
    }
}

